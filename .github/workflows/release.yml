# Образ по тегу (В7, docs/09-install.md).
#
# Версия установки — это тег образа: форк фиксирует, от какой версии он собран,
# и обновление сводится к смене тега и перезапуску. Миграции применяются
# при старте контейнера.

name: Образ

on:
  push:
    tags: ['v*']

jobs:
  image:
    name: Собрать и опубликовать
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Встроенный токен: отдельных секретов для своего реестра не нужно.
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
